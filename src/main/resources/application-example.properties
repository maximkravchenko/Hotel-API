# Example profile for any external JDBC database.
# Copy this file to application-local.properties or application-<your-db>.properties
# and replace values with your database settings.

spring.datasource.url=jdbc:your_db_type://localhost:5432/your_database
#spring.datasource.driver-class-name=your.jdbc.Driver
spring.datasource.username=your_username
spring.datasource.password=your_password

spring.jpa.database-platform=org.hibernate.dialect.YourDialect
spring.jpa.hibernate.ddl-auto=none

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
